name: Foundation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: career
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: career_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U career -d career_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://career:test_only@localhost:5432/career_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.19"
          python-version: "3.12"
      - run: uv sync --locked --group labs
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
  compose-smoke:
    runs-on: ubuntu-latest
    env:
      CAREER_API_TOKEN: ci-disposable-workspace-token-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 scripts/init_hosted.py ci.example.invalid
          docker compose --env-file .env.hosted -f compose.hosted.yaml config --quiet
          docker run --rm -e CAREER_DOMAIN=ci.example.invalid -v "$PWD/infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy adapt --config /etc/caddy/Caddyfile --validate > /dev/null
      - run: python3 scripts/start_local.py
      - run: |
          curl --fail http://localhost:8000/health
          curl --fail http://localhost:8000/ready
          curl --fail http://localhost:3000
          docker compose exec -T api career-os ingest-fixture --key ci-1
          docker compose exec -T api career-os ingest-fixture --key ci-2
          docker compose exec -T postgres psql -U career -d career -tAc "SELECT count(*) = 2 FROM raw_jobs" | grep -qx t
      - run: |
          docker compose exec -T -e CAREER_DB_RUNTIME_PASSWORD=ci-runtime-only postgres sh -s < infra/postgres/runtime-role.sh
          docker compose exec -T -e PGPASSWORD=ci-runtime-only postgres psql -h localhost -U career_runtime -d career -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM raw_jobs"
          if docker compose exec -T -e PGPASSWORD=ci-runtime-only postgres psql -h localhost -U career_runtime -d career -v ON_ERROR_STOP=1 -c "ALTER TABLE raw_jobs DISABLE TRIGGER raw_immutable"; then
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run test:e2e
        working-directory: apps/web
      - run: |
          python3 scripts/backup.py backups/ci.dump
          python3 scripts/restore_drill.py backups/ci.dump career_restore_ci
          original=$(docker compose exec -T postgres psql -U career -d career -tAc "SELECT count(*) FROM engine_records")
          restored=$(docker compose exec -T postgres psql -U career -d career_restore_ci -tAc "SELECT count(*) FROM engine_records")
          test "$original" = "$restored"
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
