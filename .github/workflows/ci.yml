name: Foundation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: career
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: career_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U career -d career_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://career:test_only@localhost:5432/career_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.19"
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build -d --wait --wait-timeout 180
      - run: |
          curl --fail http://localhost:8000/health
          curl --fail http://localhost:8000/ready
          curl --fail http://localhost:3000
          docker compose exec -T api career-os seed
          docker compose exec -T api career-os ingest-fixture --key ci-1
          docker compose exec -T api career-os ingest-fixture --key ci-2
          docker compose exec -T postgres psql -U career -d career -tAc "SELECT count(*) = 2 FROM raw_jobs" | grep -qx t
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
