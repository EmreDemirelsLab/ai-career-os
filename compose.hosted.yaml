# Single-owner hosting candidate. Validate and review before deployment.
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: career
      POSTGRES_DB: career
      POSTGRES_PASSWORD: ${CAREER_DB_ADMIN_PASSWORD:?Generate .env.hosted first}
      CAREER_DB_RUNTIME_PASSWORD: ${CAREER_DB_RUNTIME_PASSWORD:?Generate .env.hosted first}
    volumes:
      - hosted_pgdata:/var/lib/postgresql/data
      - ./infra/postgres/runtime-role.sh:/docker-entrypoint-initdb.d/10-runtime.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U career -d career"]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    environment:
      DATABASE_URL: ${CAREER_MIGRATION_DATABASE_URL:?Missing migration DSN}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres: {condition: service_healthy}
  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${CAREER_RUNTIME_DATABASE_URL:?Missing restricted runtime DSN}
      CAREER_API_TOKEN: ${CAREER_API_TOKEN:?Missing access key}
      CAREER_AI_ENABLED: ${CAREER_AI_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CAREER_AI_MODEL: ${CAREER_AI_MODEL:-}
      CAREER_AI_DAILY_CALLS: ${CAREER_AI_DAILY_CALLS:-0}
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8000
      WORKSPACE_ORIGIN: https://${CAREER_DOMAIN:?Missing domain}
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
  edge:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      CAREER_DOMAIN: ${CAREER_DOMAIN:?Missing domain}
    ports: ["80:80", "443:443"]
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web: {condition: service_healthy}
volumes:
  hosted_pgdata:
  caddy_data:
  caddy_config:
