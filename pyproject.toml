[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-career-os"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi==0.142.2", "uvicorn[standard]==0.54.0", "sqlalchemy==2.1.3", "alembic==1.20.0", "psycopg[binary]==3.3.6", "pydantic-settings==2.15.0"]

[dependency-groups]
dev = ["pytest==9.1.1", "httpx==0.28.1", "ruff==0.16.10", "mypy==2.4.0"]
labs = [
    "pandas>=2.2,<4",
]

[project.scripts]
career-os = "career_os.cli:main"

[tool.setuptools.packages.find]
where = ["apps/api"]

[tool.pytest.ini_options]
pythonpath = ["apps/api"]
testpaths = ["tests"]
markers = ["postgres: requires TEST_DATABASE_URL pointing to a disposable PostgreSQL database"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
strict = true
files = ["apps/api/career_os"]

[tool.setuptools.package-data]
career_os = ["*.json"]
